# Continuous integration — Fuel Supply Intelligence & Resilience Platform.
#
# Brief §12 asks for the delivery workflow:
#
#   Source Code -> Build -> Test -> Package -> Deploy -> Health Check
#
# This workflow covers everything up to Package, on every push and every pull
# request: install -> lint -> pytest -> build image -> verify the image.
# Deployment is `docker compose up --build`, documented in README.md, and is
# deliberately not run here.
#
# There are no secrets in this file and none are referenced. The backend reads
# DEEPSEEK_API_KEY from the environment at runtime only; nothing in the build
# needs it, and CI proves that by building the image with no environment at all
# (brief §18, CONTRACT §0.2).

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ------------------------------------------------------------------------
  # Backend: install -> lint -> pytest -> build image -> verify image
  # ------------------------------------------------------------------------
  backend:
    name: Backend (lint, test, image)
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # --- install --------------------------------------------------------
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --- lint -----------------------------------------------------------
      # Ruff is fetched here rather than added to requirements.txt: it is a CI
      # tool, not a runtime or test dependency of the application, and
      # CONTRACT §2 fixes the dependency table on purpose.
      - name: Install linter
        run: pip install "ruff==0.6.9"

      # Blocking: the errors that mean the code cannot run. Selected narrowly
      # so this gate catches real breakage and not house style.
      #   E9  syntax / IO errors      F63 invalid comparison
      #   F7  syntax errors           F82 undefined name
      - name: Lint (blocking)
        run: ruff check backend/app backend/tests backend/loadtest --select E9,F63,F7,F82

      # Advisory: the full default rule set, reported but not fatal, so style
      # drift is visible without blocking a merge on a formatting preference.
      - name: Lint (advisory)
        run: ruff check backend/app backend/tests backend/loadtest --exit-zero

      # --- test -----------------------------------------------------------
      # Run from backend/ so `app` is importable exactly as it is at runtime.
      - name: Run test suite
        working-directory: backend
        run: python -m pytest tests -v --cov=app --cov-report=term-missing

      # --- package --------------------------------------------------------
      - name: Build image
        run: docker build --tag fuel-supply-backend:ci ./backend

      # --- verify ---------------------------------------------------------
      # The .dockerignore exclusion of .env is a security control (brief §18).
      # Assert it rather than trusting it: if this step ever fails, a
      # credential is one `docker push` away from being published.
      - name: Verify no .env was baked into the image
        run: docker run --rm --entrypoint sh fuel-supply-backend:ci -c 'test ! -e /app/.env'

      - name: Verify the image runs as a non-root user
        run: |
          uid="$(docker run --rm --entrypoint id fuel-supply-backend:ci -u)"
          echo "container uid: ${uid}"
          test "${uid}" != "0"

      # `import app.main` proves only that the module parses. It does not prove
      # a route is registered, and it does not execute an endpoint body -- which
      # is exactly how `metrics_endpoint()` shipped with the wrong signature and
      # raised TypeError on every scrape while the import step stayed green.
      #
      # TestClient is used *without* `with`, so the lifespan never runs: no
      # simulator connection, no database, no network. The two endpoints below
      # are the ones the brief requires to work with no dependencies at all.
      - name: Verify the app builds and its undependency'd endpoints answer
        run: |
          docker run --rm --entrypoint python fuel-supply-backend:ci -c '
          from fastapi.testclient import TestClient
          from app.main import create_app

          app = create_app()
          paths = {route.path for route in app.routes}
          for required in ("/api/v1/health", "/metrics"):
              assert required in paths, f"{required} is not registered; got {sorted(paths)}"

          client = TestClient(app)
          health = client.get("/api/v1/health")
          assert health.status_code == 200, health.text
          assert health.json()["status"] == "ok", health.text

          metrics = client.get("/metrics")
          assert metrics.status_code == 200, metrics.text
          assert "http_requests_total" in metrics.text, "the exposition looks empty"

          print("boot check ok:", len(paths), "routes; /api/v1/health and /metrics answered")
          '

  # ------------------------------------------------------------------------
  # Frontend: install -> lint -> typecheck -> test -> build
  # ------------------------------------------------------------------------
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
