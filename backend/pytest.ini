; Pytest configuration for the backend (owner: A1).
;
; Tests are run from the repository root as:
;     backend/.venv/Scripts/python.exe -m pytest backend/tests/<file> -v
;
; This file lives in backend/, so pytest picks it up as the rootdir and
; `testpaths` / `pythonpath` below resolve relative to backend/ — that is what
; makes `import app...` work from any working directory.

[pytest]
testpaths = tests
; backend/ goes on sys.path so tests can `import app.config`, `import app.main`.
pythonpath = .

; `auto` lets an `async def test_*` run without a decorator. The whole backend
; is async, so requiring @pytest.mark.asyncio on every test is noise.
asyncio_mode = auto
; Explicit, to silence pytest-asyncio 0.24's "unset option" warning and to keep
; the default (a fresh event loop per test) deliberate rather than accidental.
asyncio_default_fixture_loop_scope = function

addopts = -ra
